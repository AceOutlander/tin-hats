<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Tin Hats: HQ gun positions</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15160f;
        overflow: hidden;
        font: 12px/1.3 system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!--
      Every HQ gun style (rows: gunner, emplacement, tripod, nest) x nation x state (columns), on a ground line with a
      58 wu soldier for scale. The red cross marks the muzzle point, the yellow frame the sprite box.
      ?zoom=2&ox=0&oy=0   magnify, ox/oy = scene coordinates of the top-left corner of the view
      ?v=2,0,0       zoom, ox and oy in one parameter
      &anchors=0    hide the muzzle marks and sprite boxes
      &mirror=1      draw mirrored (the right-hand side's view)
      &bg=day|dusk|dark   sky tone behind the pieces
      The scene is 1000 wu wide; the view always fits the page width.
    -->
    <canvas id="view"></canvas>
    <script type="module" src="./looks-gun.ts"></script>
  </body>
</html>
