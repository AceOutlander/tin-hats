<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tin Hats: menu screens preview</title>
    <style>
      /* A stand-in battlefield so the translucent plates have something behind them. */
      #game.fake-battle {
        background:
          linear-gradient(180deg, transparent 0 65%, #54502c 65% 68%, #6a6233 68% 100%),
          radial-gradient(ellipse at 22% 64%, #39422a 0 9%, transparent 9.5%),
          radial-gradient(ellipse at 61% 65%, #2f3824 0 13%, transparent 13.5%),
          radial-gradient(ellipse at 88% 64%, #39422a 0 8%, transparent 8.5%),
          linear-gradient(180deg, #7f97a8 0%, #c9c2a0 62%, #c9c2a0 100%);
      }
      #game .note {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font: 12px/1.3 monospace;
        color: rgba(255, 255, 255, 0.75);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="./ui-menus.ts"></script>
  </body>
</html>
