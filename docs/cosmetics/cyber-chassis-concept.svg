<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4cf"/><stop offset="1" stop-color="#dfe7d6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9a5f"/><stop offset="1" stop-color="#6f7a48"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#2a2e34"/>
    </linearGradient>
    <linearGradient id="plateFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33383f"/><stop offset="1" stop-color="#1e2126"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#bfeaff"/>
      <stop offset="0.7" stop-color="#4fb6f0"/><stop offset="1" stop-color="#2a6fb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="600" fill="url(#sky)"/>
  <path d="M0 330 Q200 300 420 322 T860 312 T1280 326 V420 H0Z" fill="#a9bd9a" opacity="0.7"/>
  <path d="M0 352 Q260 332 520 348 T1280 344 V430 H0Z" fill="#8ea77c"/>
  <rect y="400" width="1280" height="200" fill="url(#ground)"/>
  <rect y="462" width="1280" height="26" fill="#7d8651" opacity="0.6"/>

  <!-- scale reference: a King Tiger outline, same length as the mech is tall -->
  <g opacity="0.38" fill="#3c4046" transform="translate(40 0)">
    <path d="M905 470 h330 l12 -22 l-18 -30 h-300 l-30 30z"/>
    <path d="M985 418 l14 -42 h150 l26 42z"/>
    <rect x="850" y="388" width="150" height="10"/>
    <g fill="#2c2f34"><circle cx="945" cy="452" r="16"/><circle cx="990" cy="452" r="16"/><circle cx="1035" cy="452" r="16"/><circle cx="1080" cy="452" r="16"/><circle cx="1125" cy="452" r="16"/><circle cx="1170" cy="452" r="16"/><circle cx="1212" cy="452" r="16"/></g>
  </g>
  <text x="1110" y="505" font-size="15" fill="#2d3320" text-anchor="middle">King Tiger, for scale</text>

  <!-- ground shake dust under the planted foot -->
  <g fill="#c9c3a0" opacity="0.65"><ellipse cx="650" cy="473" rx="46" ry="10"/><ellipse cx="868" cy="474" rx="40" ry="9"/><circle cx="618" cy="462" r="10"/><circle cx="896" cy="463" r="9"/></g>
  <g stroke="#4b5231" stroke-width="3" stroke-linecap="round" opacity="0.7"><path d="M604 484 l-24 4"/><path d="M622 494 l-18 9"/><path d="M900 484 l26 3"/><path d="M884 494 l16 9"/></g>

  <!-- laser beam and its blue-tinted blast -->
  <g filter="url(#glow)">
    <line x1="462" y1="338" x2="165" y2="427" stroke="#63c8ff" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
    <line x1="462" y1="338" x2="165" y2="427" stroke="#eafaff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="150" cy="428" r="94" fill="url(#blast)"/>
  <g fill="#3a3f33" opacity="0.8"><circle cx="96" cy="372" r="5"/><circle cx="206" cy="356" r="4"/><circle cx="236" cy="398" r="5"/><circle cx="72" cy="418" r="4"/><circle cx="150" cy="328" r="4"/></g>
  <ellipse cx="150" cy="472" rx="72" ry="9" fill="#2b2f24" opacity="0.5"/>
  <g fill="#6b7178" opacity="0.55" filter="url(#soft)"><circle cx="150" cy="326" r="34"/><circle cx="185" cy="290" r="26"/></g>

  <!-- THE MECH (enemy: faces left) -->
  <!-- far leg, lifted mid-stomp -->
  <g fill="url(#plateFar)" stroke="#15171a" stroke-width="3" stroke-linejoin="round">
    <path d="M756 290 L826 296 L760 384 L690 362Z"/>
    <path d="M690 362 L760 384 L722 440 L664 428Z"/>
    <path d="M612 422 L744 430 L750 454 L600 450Z"/>
  </g>
  <!-- far arm: heavy machine gun -->
  <g fill="url(#plateFar)" stroke="#15171a" stroke-width="3" stroke-linejoin="round">
    <path d="M690 184 h80 v44 h-80z"/>
    <rect x="588" y="194" width="108" height="8"/><rect x="588" y="206" width="108" height="8"/>
    <rect x="632" y="190" width="16" height="32"/>
  </g>
  <g stroke="#7fd6ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <line x1="570" y1="203" x2="532" y2="206"/><line x1="492" y1="209" x2="454" y2="212"/><line x1="412" y1="215" x2="374" y2="218"/><line x1="322" y1="222" x2="288" y2="225"/>
  </g>
  <circle cx="582" cy="203" r="9" fill="#c9f0ff" filter="url(#glow)"/>

  <!-- back: reactor stacks and aerial -->
  <g fill="url(#plateFar)" stroke="#15171a" stroke-width="3">
    <rect x="852" y="92" width="22" height="60"/><rect x="880" y="108" width="20" height="52"/>
    <line x1="838" y1="124" x2="858" y2="46" stroke-width="3"/>
  </g>
  <rect x="855" y="96" width="16" height="6" fill="#7fd6ff" filter="url(#glow)"/><rect x="883" y="112" width="14" height="6" fill="#7fd6ff" filter="url(#glow)"/>

  <!-- hips -->
  <path d="M722 262 h124 l14 44 h-152z" fill="url(#plate)" stroke="#15171a" stroke-width="3" stroke-linejoin="round"/>
  <!-- near leg, planted: thick thigh and shin, a wide heavy foot -->
  <g fill="url(#plate)" stroke="#15171a" stroke-width="3" stroke-linejoin="round">
    <path d="M746 292 L838 300 L794 386 L698 366Z"/>
    <path d="M698 366 L794 386 L830 440 L750 450Z"/>
    <path d="M664 442 L866 442 L886 470 L626 470 L644 450Z"/>
    <circle cx="802" cy="300" r="28"/><circle cx="746" cy="378" r="25"/><circle cx="800" cy="444" r="17"/>
    <path d="M770 318 L822 324 L800 370 L742 358Z" fill="#555c66"/>
  </g>
  <!-- torso -->
  <path d="M670 146 L856 128 L896 250 L836 286 L724 286 L652 232Z" fill="url(#plate)" stroke="#15171a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M670 146 L732 190 L724 286" fill="none" stroke="#15171a" stroke-width="2"/>
  <!-- head with visor -->
  <path d="M690 96 L792 84 L810 144 L684 156Z" fill="url(#plate)" stroke="#15171a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M688 114 L750 108 L750 124 L686 131Z" fill="#8fe0ff" filter="url(#glow)"/>

  <!-- glowing seams -->
  <g fill="none" stroke="#6fd2ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M690 228 L734 262 L830 262"/>
    <path d="M852 176 L874 244"/>
    <path d="M728 332 L744 352"/>
    <path d="M736 402 L772 440"/>
    <path d="M654 458 L872 458"/>
    <circle cx="802" cy="300" r="10"/><circle cx="746" cy="378" r="9"/>
  </g>

  <!-- near arm: the big arm cannon, aimed down the beam -->
  <g transform="rotate(-16.7 770 246)">
    <g fill="url(#plate)" stroke="#15171a" stroke-width="3" stroke-linejoin="round">
      <rect x="540" y="208" width="262" height="76" rx="8"/>
      <rect x="470" y="222" width="78" height="48"/>
      <rect x="452" y="212" width="22" height="68" rx="4"/>
      <rect x="688" y="196" width="96" height="100" rx="10"/>
      <rect x="560" y="284" width="110" height="14" rx="4"/>
    </g>
    <g fill="#7fd6ff" filter="url(#glow)"><rect x="574" y="213" width="8" height="66"/><rect x="608" y="213" width="8" height="66"/><rect x="642" y="213" width="8" height="66"/><rect x="484" y="226" width="5" height="40"/><rect x="500" y="226" width="5" height="40"/></g>
    <circle cx="452" cy="246" r="16" fill="#eafaff" filter="url(#glow)"/>
  </g>
  <!-- shoulder -->
  <path d="M716 128 h100 a16 16 0 0 1 16 16 v58 h-132 v-58 a16 16 0 0 1 16 -16z" fill="url(#plate)" stroke="#15171a" stroke-width="3"/>
  <path d="M708 186 h116" stroke="#6fd2ff" stroke-width="3" filter="url(#glow)"/>
  <!-- plain straight-armed cross, as on the tank -->
  <g transform="translate(766 158)"><path d="M-12 -4 h8 v-8 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8z" fill="#e8e8e8"/><path d="M-9 -2 h7 v-7 h4 v7 h7 v4 h-7 v7 h-4 v-7 h-7z" fill="#15171a"/></g>

  <!-- inset: the charge-up just before each shot -->
  <g transform="translate(36 70)">
    <rect width="300" height="170" rx="8" fill="#eef2e6" stroke="#1c2414" stroke-width="1.5" opacity="0.95"/>
    <text x="150" y="24" font-size="15" font-weight="bold" fill="#1c2414" text-anchor="middle">Just before each shot</text>
    <g fill="url(#plate)" stroke="#15171a" stroke-width="3"><rect x="150" y="62" width="140" height="64" rx="6"/><rect x="104" y="72" width="52" height="44"/><rect x="90" y="64" width="18" height="60" rx="3"/></g>
    <g fill="#bfeeff" filter="url(#glow)"><rect x="176" y="67" width="8" height="54"/><rect x="206" y="67" width="8" height="54"/><rect x="236" y="67" width="8" height="54"/><rect x="118" y="76" width="5" height="36"/><rect x="134" y="76" width="5" height="36"/></g>
    <circle cx="76" cy="94" r="30" fill="url(#blast)"/>
    <circle cx="80" cy="94" r="11" fill="#ffffff" filter="url(#glow)"/>
    <g stroke="#7fd6ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"><path d="M30 60 l22 16"/><path d="M22 94 h26"/><path d="M30 128 l22 -16"/><path d="M62 46 l8 22"/><path d="M62 142 l8 -22"/></g>
    <text x="150" y="152" font-size="13" fill="#1c2414" text-anchor="middle">light gathers at the barrel, coils brighten</text>
  </g>

  <!-- scale reference: a soldier -->
  <g fill="#14161a" opacity="0.9" transform="translate(116 0)">
    <circle cx="410" cy="405" r="8"/><path d="M398 398 h24 l3 5 h-30z"/>
    <path d="M406 413 h8 v30 l8 27 h-7 l-5 -22 l-5 22 h-7 l8 -27z"/>
    <path d="M412 420 l22 6 l-1 5 l-22 -5z"/>
  </g>
  <text x="526" y="505" font-size="15" fill="#2d3320" text-anchor="middle">soldier, for scale</text>

  <!-- labels -->
  <g font-size="15" fill="#1c2414">
    <text x="640" y="34" font-size="22" font-weight="bold" text-anchor="middle">"Cyber Chassis" concept sketch 2: enemy King Tiger skin (not in the game)</text>
    <g stroke="#1c2414" stroke-width="1.5" fill="none"><path d="M566 100 L686 116"/><path d="M620 68 L640 188"/><path d="M312 264 L500 300"/><path d="M944 220 L886 212"/><path d="M944 340 L834 344"/><path d="M944 430 L880 452"/><path d="M250 540 L190 472"/></g>
    <text x="558" y="98" text-anchor="end">light-blue visor</text>
    <text x="620" y="62" text-anchor="middle">right arm: machine gun, blue tracers</text>
    <text x="186" y="268" text-anchor="middle">left arm: bigger cannon, laser beam</text>
    <text x="950" y="225">gunmetal plates, glowing seams</text>
    <text x="950" y="345">thick thighs and shins</text><text x="950" y="435">wide, heavy feet</text>
    <text x="256" y="556">blue-tinted blast</text>
  </g>
</svg>
