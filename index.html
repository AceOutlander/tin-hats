<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14150f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Tin Hats: a 2D side-view WW2 real-time strategy game that runs in your phone browser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tin Hats" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>Tin Hats</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14150f;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14150f;
        color: #c9bd9b;
        font: 700 18px/1 'Arial Narrow', 'Helvetica Neue', sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      #boot-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot-bar {
        width: min(220px, 60vw);
        height: 6px;
        border: 1px solid #6f6a52;
        background: #1d1f16;
      }
      #boot-fill {
        width: 0;
        height: 100%;
        background: #c9bd9b;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot" role="status">
      <div id="boot-box">
        <div id="boot-label">Loading</div>
        <div id="boot-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="boot-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
